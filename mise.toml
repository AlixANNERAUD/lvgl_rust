# Development tools and tasks. `mise install` sets up the toolchain, then
# `mise run <task>` (or `mise tasks` to list them). Tasks mirror CI, including
# `RUSTFLAGS=-D warnings`.
min_version = "2026.9.2"

[tools]
# `targets` are the cross targets built in CI (`cross-*` tasks).
# `mr_boxington` routes Cargo through mbx, a shared build cache: LVGL's C
# objects and the build script output are restored instead of recompiled.
rust = { version = "stable", components = "rustfmt,clippy,llvm-tools", targets = "wasm32-unknown-unknown,wasm32-wasip1,riscv32imc-unknown-none-elf,thumbv6m-none-eabi,thumbv7em-none-eabihf,thumbv8m.main-none-eabihf", mr_boxington = true }
mr-boxington = "latest"
# Coverage (`mise run coverage`).
"aqua:taiki-e/cargo-llvm-cov" = "latest"

# C toolchains for the embedded cross builds (`mise bootstrap packages apply`).
[bootstrap.packages]
"apt:gcc-riscv64-unknown-elf" = { os = "linux" }
"apt:picolibc-riscv64-unknown-elf" = { os = "linux" }
"apt:gcc-arm-none-eabi" = { os = "linux" }
"apt:libnewlib-arm-none-eabi" = { os = "linux" }

# How `cc` and bindgen find those toolchains (Debian/Ubuntu paths). Only
# builds for these targets read them.
[env]
# Stale entries in lvgl-rust-gen's tables fail the build here (downstream
# builds only warn).
LVGL_RUST_GEN_STRICT = "1"
CC_riscv32imc_unknown_none_elf = "riscv64-unknown-elf-gcc"
AR_riscv32imc_unknown_none_elf = "riscv64-unknown-elf-ar"
CFLAGS_riscv32imc_unknown_none_elf = "-isystem /usr/lib/picolibc/riscv64-unknown-elf/include"
BINDGEN_EXTRA_CLANG_ARGS_riscv32imc_unknown_none_elf = "-isystem /usr/lib/picolibc/riscv64-unknown-elf/include"
CC_thumbv6m_none_eabi = "arm-none-eabi-gcc"
AR_thumbv6m_none_eabi = "arm-none-eabi-ar"
CFLAGS_thumbv6m_none_eabi = "-isystem /usr/include/newlib"
BINDGEN_EXTRA_CLANG_ARGS_thumbv6m_none_eabi = "-isystem /usr/include/newlib"
CC_thumbv7em_none_eabihf = "arm-none-eabi-gcc"
AR_thumbv7em_none_eabihf = "arm-none-eabi-ar"
CFLAGS_thumbv7em_none_eabihf = "-isystem /usr/include/newlib"
BINDGEN_EXTRA_CLANG_ARGS_thumbv7em_none_eabihf = "-isystem /usr/include/newlib"
# thumbv8m.main has a dot in its name: `CFLAGS_<target>` & co. would not
# survive mbx's build-script wrapper (a POSIX sh script, and dash drops such
# names), so `cross-arm` passes these through the generic TARGET_* variables.
ARM_NEWLIB_FLAGS = "-isystem /usr/include/newlib"

[tasks.submodules]
description = "Check out the LVGL and shadcn theme submodules"
run = "git submodule update --init --recursive"

[tasks.fetch]
description = "Download dependencies of the nested packages built offline by the tests"
run = [
  "cargo fetch --manifest-path lvgl-rust-sys/examples/external-fonts/Cargo.toml",
  "cargo fetch --manifest-path lvgl-rust-sys/tests/fixtures/font_incremental/Cargo.toml",
]

[tasks.fmt]
description = "Check formatting of the workspace, the example, the fixture, the compile-fail cases and the social banner program"
run = [
  "cargo fmt --all --check",
  # trybuild cases are not cargo targets: `cargo fmt` does not see them.
  "rustfmt --edition 2024 --check lvgl-rust/tests/compile-fail/*.rs lvgl-rust/tests/compile-fail/*/*.rs lvgl-rust/tests/compile-pass/*.rs",
  "cargo fmt --check --manifest-path lvgl-rust-sys/examples/external-fonts/Cargo.toml",
  "cargo fmt --check --manifest-path lvgl-rust-sys/tests/fixtures/font_incremental/Cargo.toml",
  "cargo fmt --check --manifest-path assets/social-banner/screen/Cargo.toml",
]

[tasks.clippy]
env = { RUSTFLAGS = "-D warnings" }
description = "Run clippy on lvgl-rust-sys (default, all and no default features) and lvgl-rust-gen"
run = [
  "cargo clippy -p lvgl-rust-sys -p lvgl-rust-gen --all-targets",
  "cargo clippy -p lvgl-rust-sys --all-targets --all-features",
  "cargo clippy -p lvgl-rust-sys --all-targets --no-default-features",
]

[tasks.test-fast]
env = { RUSTFLAGS = "-D warnings" }
description = "Library and build-config tests (seconds)"
run = "cargo test -p lvgl-rust-sys --lib --test build_config"

[tasks.test]
env = { RUSTFLAGS = "-D warnings" }
description = "Full test suite, including the slow integration tests"
depends = ["fetch"]
run = "cargo test -p lvgl-rust-sys -p lvgl-rust-gen"

[tasks.package]
description = "Package the three crates as crates.io would, and build each one from its package"
env.DEP_LV_CONFIG_PATH = "{{config_root}}/lvgl-rust/conf"
env.CARGO_TARGET_DIR = "target/package"
# Verification builds lvgl-rust from the packaged generator, whose tables
# sit at the same paths in cargo's temporary registry on every run: mbx's
# build-script cache could replay generated code from other tables.
env.MBX_BUILD_SCRIPT_EXECUTION = "false"
# That temporary registry has the same path and versions on every run, and
# cargo treats registry packages as immutable: it keeps the sources it
# extracted into $CARGO_HOME/registry/src (which the CI cache carries from
# job to job) and the units built from them in the target directory, so a
# later run would verify lvgl-rust against the generator and bindings of an
# older revision. Start from neither.
run = [
  "rm -rf {{config_root}}/target/package \"${CARGO_HOME:-$HOME/.cargo}\"/registry/src/-*/lvgl-rust-*",
  "cargo package -p lvgl-rust-sys -p lvgl-rust-gen -p lvgl-rust",
]

[tasks.coverage]
description = "Coverage of the Rust code of the three crates, written to coverage.lcov"
# lvgl-rust-sys runs with its own configuration and lvgl-rust with the OBJ_ID
# one, so the report merges three runs. The slow integration tests are left
# out: they only drive nested builds. mbx's build-script wrapper is turned
# off: llvm-cov reads every binary of the target directory and cannot parse it.
env.MBX_BUILD_SCRIPT_EXECUTION = "false"
run = [
  "cargo llvm-cov clean --workspace",
  "cargo llvm-cov --no-report -p lvgl-rust-sys --lib --test build_config",
  "cargo llvm-cov --no-report -p lvgl-rust-gen",
  "DEP_LV_CONFIG_PATH={{config_root}}/lvgl-rust/conf cargo llvm-cov --no-report -p lvgl-rust --features async,heap,fmt",
  "cargo llvm-cov report --lcov --output-path coverage.lcov",
]

[tasks.social-banner]
description = "Render assets/social-banner/social-banner.png, the GitHub social preview (real LVGL output; downloads its fonts)"
tools = { "cargo:resvg" = "0.49.0" }
run = "sh assets/social-banner/render.sh"

[tasks.cross-wasm32]
env = { RUSTFLAGS = "-D warnings" }
description = "Build lvgl-rust-sys and lvgl-rust for wasm32-unknown-unknown (no C library; needs clang)"
run = [
  "cargo build -p lvgl-rust-sys --target wasm32-unknown-unknown",
  "DEP_LV_CONFIG_PATH={{config_root}}/lvgl-rust/conf CARGO_TARGET_DIR=target/safe-wasm32 cargo build -p lvgl-rust --target wasm32-unknown-unknown",
  "DEP_LV_CONFIG_PATH={{config_root}}/lvgl-rust/conf CARGO_TARGET_DIR=target/safe-wasm32 cargo build -p lvgl-rust --target wasm32-unknown-unknown --features growable-registry",
]

[tasks.cross-wasip1]
description = "Build for wasm32-wasip1 with wasi-sdk, then run the tests and the desktop example under wasmtime"
# Task-scoped: wasi-sdk's `bin` has its own `clang`, `ar` and `nm`, which
# must not shadow the host ones for other tasks.
tools = { "github:WebAssembly/wasi-sdk" = "wasi-sdk-33", wasmtime = "50.0.0" }
env.RUSTFLAGS = "-D warnings"
# `wasm32-wasip1-clang` targets WASI and finds the SDK's sysroot itself.
env.CC_wasm32_wasip1 = "wasm32-wasip1-clang"
env.AR_wasm32_wasip1 = "llvm-ar"
env.CARGO_TARGET_WASM32_WASIP1_RUNNER = "wasmtime"
# bindgen's libclang does not read the SDK's `clang.cfg`: it gets the same
# sysroot explicitly. Tests that spawn threads (WASI has none) or catch
# panics (wasm aborts) are ignored on this target.
run = """
sdk="$(dirname "$(command -v wasm32-wasip1-clang)")/.."
export BINDGEN_EXTRA_CLANG_ARGS_wasm32_wasip1="--sysroot=$sdk/share/wasi-sysroot"
cargo test -p lvgl-rust-sys --lib --target wasm32-wasip1
export DEP_LV_CONFIG_PATH={{config_root}}/lvgl-rust/conf CARGO_TARGET_DIR=target/safe-wasip1
cargo test -p lvgl-rust --features async,heap,fmt --target wasm32-wasip1
cargo run -q -p lvgl-rust --example desktop --target wasm32-wasip1
"""

[tasks.cross-riscv32]
description = "Build lvgl-rust-sys for riscv32imc-unknown-none-elf (C toolchain from `mise bootstrap packages apply`)"
env.RUSTFLAGS = "-D warnings"
run = "cargo build -p lvgl-rust-sys --target riscv32imc-unknown-none-elf"

[tasks.cross-arm]
description = "Build lvgl-rust firmware for Cortex-M4/M7 (thumbv7em) and Cortex-M33 (thumbv8m.main), with handles and views only"
env.RUSTFLAGS = "-D warnings"
run = [
  "DEP_LV_CONFIG_PATH={{config_root}}/lvgl-rust/conf CARGO_TARGET_DIR=target/cross-arm cargo build -q -p lvgl-rust-size-gate --profile size --target thumbv7em-none-eabihf",
  # Generic TARGET_* variables: see ARM_NEWLIB_FLAGS.
  "TARGET_CC=arm-none-eabi-gcc TARGET_AR=arm-none-eabi-ar TARGET_CFLAGS=\"$ARM_NEWLIB_FLAGS\" BINDGEN_EXTRA_CLANG_ARGS=\"$ARM_NEWLIB_FLAGS\" DEP_LV_CONFIG_PATH={{config_root}}/lvgl-rust/conf CARGO_TARGET_DIR=target/cross-arm cargo build -q -p lvgl-rust-size-gate --profile size --target thumbv8m.main-none-eabihf",
  "DEP_LV_CONFIG_PATH={{config_root}}/lvgl-rust-sys/conf LVGL_RUST_HANDLE_SLOTS=0 CARGO_TARGET_DIR=target/cross-arm-views cargo build -q -p lvgl-rust-size-gate --profile size --target thumbv7em-none-eabihf",
]

[tasks.size-gate]
description = "Check lvgl-rust's footprint in thumbv6m and riscv32imc firmware (see lvgl-rust/size-gate/gate.sh)"
env.RUSTFLAGS = "-D warnings"
# Budgets: the crate's code in bytes, with N = 16 slots and in views-only
# mode. Raise them only with the feature that needs it (the composite part
# checks took about 1.35 KB on thumbv6m, the calendar and tile view part
# tables 242 B on riscv32imc). The last runs add the diagnostic features:
# +8 B of .bss for the counters, defmt built for thumbv6m and free while
# nothing logs, within the same budgets, except views-only thumbv6m with
# the counters: 2368 B, since the part tables and the counters together
# took 2310 B. `growable-registry` has its own budgets (5376 B, 7168 B):
# chunk lookups and growth took 5146 B on thumbv6m and 6868 B on
# riscv32imc, against 4518 B and 5674 B without it; its firmware brings a
# bump allocator (firmware symbols, not counted).
run = [
  "lvgl-rust/size-gate/gate.sh thumbv6m-none-eabi 16 4608",
  "lvgl-rust/size-gate/gate.sh thumbv6m-none-eabi 0 2304",
  "lvgl-rust/size-gate/gate.sh riscv32imc-unknown-none-elf 16 5888",
  "lvgl-rust/size-gate/gate.sh riscv32imc-unknown-none-elf 0 2944",
  "lvgl-rust/size-gate/gate.sh thumbv6m-none-eabi 16 4608 defmt,debug-counters",
  "lvgl-rust/size-gate/gate.sh thumbv6m-none-eabi 0 2368 debug-counters",
  "lvgl-rust/size-gate/gate.sh riscv32imc-unknown-none-elf 16 5888 debug-counters",
  "lvgl-rust/size-gate/gate.sh thumbv6m-none-eabi 16 5376 growable-registry",
  "lvgl-rust/size-gate/gate.sh riscv32imc-unknown-none-elf 16 7168 growable-registry",
  # The firmware builds without `async` and `heap`: check they compile for
  # both targets too, with `growable-registry`.
  "DEP_LV_CONFIG_PATH={{config_root}}/lvgl-rust/conf CARGO_TARGET_DIR=target/size-gate/features cargo check -q -p lvgl-rust --features async,heap,growable-registry --target thumbv6m-none-eabi",
  "DEP_LV_CONFIG_PATH={{config_root}}/lvgl-rust/conf CARGO_TARGET_DIR=target/size-gate/features cargo check -q -p lvgl-rust --features async,heap,growable-registry --target riscv32imc-unknown-none-elf",
]

[tasks.overhead]
description = "Measure lvgl-rust's time and memory overhead over raw calls and write documentation/reference/overhead.md"
# Not in CI: host times vary between machines. The benchmark (release
# profile) runs first, then the size gate builds (with the C toolchains of
# `mise bootstrap packages apply`; otherwise the script reads the size gate
# of CI), one after the other.
env.RUSTFLAGS = "-D warnings"
env.DEP_LV_CONFIG_PATH = "{{config_root}}/lvgl-rust/conf"
env.CARGO_TARGET_DIR = "target/overhead"
run = "lvgl-rust/benches/overhead-report.sh"

[tasks.msrv]
description = "Check the workspace with the minimum Rust version, on the host and the cross targets"
# Keep in sync with `rust-version` in the root Cargo.toml.
tools = { rust = { version = "1.89", targets = "wasm32-unknown-unknown,riscv32imc-unknown-none-elf" } }
env.RUSTFLAGS = "-D warnings"
# A separate target directory: another compiler version invalidates the
# regular build.
env.CARGO_TARGET_DIR = "target/msrv"
env.DEP_LV_CONFIG_PATH = "{{config_root}}/lvgl-rust/conf"
run = [
  "rustc --version",
  "cargo check --workspace --all-targets",
  "cargo check -p lvgl-rust-sys -p lvgl-rust --target wasm32-unknown-unknown",
  "cargo check -p lvgl-rust-sys -p lvgl-rust --target riscv32imc-unknown-none-elf --features lvgl-rust/growable-registry",
]

# lvgl-rust builds lvgl-rust-sys with its own configuration (OBJ_ID hooks
# enabled), so its tasks set `DEP_LV_CONFIG_PATH` and use their own target
# directory instead of invalidating the lvgl-rust-sys build.
[tasks.clippy-safe]
description = "Run clippy on lvgl-rust"
env.RUSTFLAGS = "-D warnings"
env.DEP_LV_CONFIG_PATH = "{{config_root}}/lvgl-rust/conf"
env.CARGO_TARGET_DIR = "target/safe"
run = [
  "cargo clippy -p lvgl-rust -p lvgl-rust-size-gate --all-targets --features lvgl-rust/async,lvgl-rust/heap,lvgl-rust/fmt,lvgl-rust/defmt,lvgl-rust/debug-counters",
  "cargo clippy -p lvgl-rust --all-targets --features async,heap,fmt,growable-registry",
]

[tasks.test-safe]
description = "Test lvgl-rust against LVGL, with a fixed and a growable registry"
env.RUSTFLAGS = "-D warnings"
env.DEP_LV_CONFIG_PATH = "{{config_root}}/lvgl-rust/conf"
env.CARGO_TARGET_DIR = "target/safe"
# Both registries, each with the diagnostic features.
run = [
  "cargo test -p lvgl-rust --features async,heap,fmt,defmt,debug-counters",
  "cargo test -p lvgl-rust --features async,heap,fmt,defmt,debug-counters,growable-registry",
]

[tasks.test-views-only]
description = "Lint and test lvgl-rust without handles, on a config that keeps LVGL's own OBJ_ID support"
env.RUSTFLAGS = "-D warnings"
env.LVGL_RUST_HANDLE_SLOTS = "0"
env.DEP_LV_CONFIG_PATH = "{{config_root}}/lvgl-rust-sys/conf"
env.CARGO_TARGET_DIR = "target/views-only"
run = [
  "cargo clippy -p lvgl-rust --all-targets",
  "cargo clippy -p lvgl-rust --all-targets --features defmt,debug-counters",
  "cargo test -p lvgl-rust",
  # `growable-registry` has no effect without a registry.
  "cargo clippy -p lvgl-rust --all-targets --features async,heap,growable-registry",
  "cargo test -p lvgl-rust --features async,heap,growable-registry",
  "cargo test -p lvgl-rust --features defmt,debug-counters --test counters",
]

[tasks.test-asan]
description = "Test lvgl-rust with LVGL under AddressSanitizer (C library malloc, so freed objects are visible)"
# Rust's sanitizer support (nightly) links LLVM's runtime; clang builds LVGL
# against it. An explicit --target keeps build scripts uninstrumented.
tools = { rust = { version = "nightly", components = "rust-src" } }
env.DEP_LV_CONFIG_PATH = "{{config_root}}/target/asan-conf"
env.CARGO_TARGET_DIR = "target/asan"
env.CC = "clang"
env.CFLAGS = "-fsanitize=address -fno-omit-frame-pointer"
env.RUSTFLAGS = "-Zsanitizer=address"
# LVGL keeps global allocations until exit.
env.ASAN_OPTIONS = "detect_leaks=0"
run = [
  "mkdir -p target/asan-conf",
  "sed 's/^#define LV_USE_STDLIB_MALLOC .*/#define LV_USE_STDLIB_MALLOC LV_STDLIB_CLIB/' lvgl-rust/conf/lv_conf.h > target/asan-conf/lv_conf.h",
  "cargo test -p lvgl-rust --features async,heap,fmt --target \"$(rustc -vV | sed -n 's/^host: //p')\"",
  "cargo run -q -p lvgl-rust --example desktop --target \"$(rustc -vV | sed -n 's/^host: //p')\"",
]

[tasks.example]
description = "Run the examples of lvgl-rust on the host: the tutorial's first application, then the scripted desktop shell"
env.RUSTFLAGS = "-D warnings"
env.DEP_LV_CONFIG_PATH = "{{config_root}}/lvgl-rust/conf"
env.CARGO_TARGET_DIR = "target/safe"
run = [
  "cargo run -q -p lvgl-rust --example first_application",
  "cargo run -q -p lvgl-rust --example desktop",
]

[tasks.test-matrix]
description = "Test lvgl-rust with 16-bit color, and with 32-bit color and the shadcn theme"
env.RUSTFLAGS = "-D warnings"
env.DEP_LV_CONFIG_PATH = "{{config_root}}/lvgl-rust/conf"
run = [
  "CARGO_TARGET_DIR=target/matrix-16 cargo test -q -p lvgl-rust --features color_depth_16,async,heap,fmt",
  "CARGO_TARGET_DIR=target/matrix-32 cargo test -q -p lvgl-rust --features color_depth_32,shadcn-theme,async,heap,fmt",
]

[tasks.test-compile-fail]
description = "Check that lvgl-rust rejects the programs of lvgl-rust/tests/compile-fail, with the expected errors (trybuild)"
# The expected messages are rustc's: the compiler is pinned, and the
# snapshots are refreshed with `TRYBUILD=overwrite` when it is raised.
tools = { rust = "1.99.1" }
env.DEP_LV_CONFIG_PATH = "{{config_root}}/lvgl-rust/conf"
# Absolute: the test runs in lvgl-rust/, and trybuild puts its project
# under the target directory.
env.CARGO_TARGET_DIR = "{{config_root}}/target/compile-fail"
run = "cargo test -p lvgl-rust --features async,heap --test compile_fail -- --ignored"

[tasks.test-allocator]
description = "Lint and test lvgl-rust's allocator feature, on a configuration whose heap is the Rust allocator (LV_STDLIB_CUSTOM)"
env.RUSTFLAGS = "-D warnings"
env.DEP_LV_CONFIG_PATH = "{{config_root}}/target/allocator-conf"
env.CARGO_TARGET_DIR = "target/allocator"
run = [
  "mkdir -p target/allocator-conf",
  "sed 's/^#define LV_USE_STDLIB_MALLOC .*/#define LV_USE_STDLIB_MALLOC LV_STDLIB_CUSTOM/' lvgl-rust/conf/lv_conf.h > target/allocator-conf/lv_conf.h",
  "cargo clippy -p lvgl-rust --features allocator,heap --all-targets",
  "cargo test -p lvgl-rust --features allocator,heap --test allocator",
]

[tasks.miri]
description = "Run the lvgl-rust core tests under Miri, against the Rust model of LVGL"
tools = { rust = { version = "nightly", components = "miri,rust-src" } }
env.DEP_LV_CONFIG_PATH = "{{config_root}}/lvgl-rust/conf"
env.CARGO_TARGET_DIR = "target/miri"
# The model passes C pointers through exposed provenance, as C code does.
env.MIRIFLAGS = "-Zmiri-permissive-provenance"
# Miri provides its own `strlen` & co. The second run adds `heap`: the
# deferred-free list and `LvBox` against the model's heap; the third the
# registry chunks of `growable-registry`, against the global allocator.
run = [
  "cargo miri test -p lvgl-rust --lib --no-default-features",
  "cargo miri test -p lvgl-rust --lib --no-default-features --features heap",
  "cargo miri test -p lvgl-rust --lib --no-default-features --features growable-registry",
]

[tasks.loom]
description = "Model-check the cross-thread request protocol of lvgl-rust with loom"
env.RUSTFLAGS = "--cfg loom"
env.LVGL_RUST_HANDLE_SLOTS = "4"
env.DEP_LV_CONFIG_PATH = "{{config_root}}/lvgl-rust/conf"
env.CARGO_TARGET_DIR = "target/loom"
# The second run adds chunk publication (`growable-registry`).
run = [
  "cargo test -p lvgl-rust --lib --release protocol",
  "cargo test -p lvgl-rust --lib --release --features growable-registry protocol",
]

# The access audit: compiles LVGL to LLVM IR with a pinned clang and
# derives lvgl-rust-gen/tables/<version>/access.toml from its call graph.
[tasks.audit]
description = "Rewrite access.toml from the call graph of LVGL (after changing audit.toml or bumping LVGL)"
tools = { clang = "22.1.8" }
run = "cargo run -q -p lvgl-rust-gen --features cli -- audit"

[tasks.bump]
description = "Regenerate universe.txt and report hierarchy and stale table entries (after bumping LVGL or changing lvgl-rust/conf)"
run = "cargo run -q -p lvgl-rust-gen --features cli -- bump"

[tasks.audit-check]
description = "Lint and test the audit tool, and check that access.toml, universe.txt and the hierarchy match LVGL"
tools = { clang = "22.1.8" }
env.RUSTFLAGS = "-D warnings"
run = [
  "cargo clippy -p lvgl-rust-gen --all-targets --features cli",
  "cargo test -p lvgl-rust-gen --features cli",
  "cargo run -q -p lvgl-rust-gen --features cli -- audit --check",
  "cargo run -q -p lvgl-rust-gen --features cli -- bump --check",
]

[tasks.doc]
description = "Build the documentation as docs.rs does"
env = { DOCS_RS = "1", DEP_LV_CONFIG_PATH = "", RUSTDOCFLAGS = "-D warnings" }
run = [
  "cargo doc --no-deps -p lvgl-rust-sys --no-default-features",
  "cargo doc --no-deps -p lvgl-rust",
]

[tasks.check]
description = "Checks to run before pushing"
# Sequential: concurrent builds in the same target directory race under mbx.
run = [
  { task = "fmt" },
  { task = "clippy" },
  { task = "test-fast" },
  { task = "clippy-safe" },
  { task = "test-safe" },
]
