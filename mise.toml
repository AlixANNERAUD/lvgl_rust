# Development tools and tasks. `mise install` sets up the toolchain, then
# `mise run <task>` (or `mise tasks` to list them). Tasks mirror CI, including
# `RUSTFLAGS=-D warnings`.
min_version = "2026.9.2"

[tools]
# `targets` are the cross targets built in CI (`cross-*` tasks).
# `mr_boxington` routes Cargo through mbx, a shared build cache: LVGL's C
# objects and the build script output are restored instead of recompiled.
rust = { version = "stable", components = "rustfmt,clippy", targets = "wasm32-unknown-unknown,riscv32imc-unknown-none-elf", mr_boxington = true }
mr-boxington = "latest"

# C toolchain for the riscv32imc cross build (`mise bootstrap packages apply`).
[bootstrap.packages]
"apt:gcc-riscv64-unknown-elf" = { os = "linux" }
"apt:picolibc-riscv64-unknown-elf" = { os = "linux" }

[tasks.submodules]
description = "Check out the LVGL and shadcn theme submodules"
run = "git submodule update --init --recursive"

[tasks.fetch]
description = "Download dependencies of the nested packages built offline by the tests"
run = [
  "cargo fetch --manifest-path lvgl-rust-sys/examples/external-fonts/Cargo.toml",
  "cargo fetch --manifest-path lvgl-rust-sys/tests/fixtures/font_incremental/Cargo.toml",
]

[tasks.fmt]
description = "Check formatting of the workspace, the example and the fixture"
run = [
  "cargo fmt --all --check",
  "cargo fmt --check --manifest-path lvgl-rust-sys/examples/external-fonts/Cargo.toml",
  "cargo fmt --check --manifest-path lvgl-rust-sys/tests/fixtures/font_incremental/Cargo.toml",
]

[tasks.clippy]
env = { RUSTFLAGS = "-D warnings" }
description = "Run clippy on the workspace, and on lvgl_rust_sys with all and no default features"
run = [
  "cargo clippy --workspace --all-targets",
  "cargo clippy -p lvgl_rust_sys --all-targets --all-features",
  "cargo clippy -p lvgl_rust_sys --all-targets --no-default-features",
]

[tasks.test-fast]
env = { RUSTFLAGS = "-D warnings" }
description = "Library and build-config tests (seconds)"
run = "cargo test -p lvgl_rust_sys --lib --test build_config"

[tasks.test]
env = { RUSTFLAGS = "-D warnings" }
description = "Full test suite, including the slow integration tests"
depends = ["fetch"]
run = "cargo test --workspace"

[tasks.cross-wasm32]
env = { RUSTFLAGS = "-D warnings" }
description = "Build lvgl_rust_sys for wasm32-unknown-unknown (no C library; needs clang)"
run = "cargo build -p lvgl_rust_sys --target wasm32-unknown-unknown"

[tasks.cross-riscv32]
description = "Build lvgl_rust_sys for riscv32imc-unknown-none-elf (C toolchain from `mise bootstrap packages apply`)"
env.RUSTFLAGS = "-D warnings"
env.CC_riscv32imc_unknown_none_elf = "riscv64-unknown-elf-gcc"
env.AR_riscv32imc_unknown_none_elf = "riscv64-unknown-elf-ar"
env.CFLAGS_riscv32imc_unknown_none_elf = "-isystem /usr/lib/picolibc/riscv64-unknown-elf/include"
env.BINDGEN_EXTRA_CLANG_ARGS_riscv32imc_unknown_none_elf = "-isystem /usr/lib/picolibc/riscv64-unknown-elf/include"
run = "cargo build -p lvgl_rust_sys --target riscv32imc-unknown-none-elf"

[tasks.doc]
description = "Build the documentation as docs.rs does"
env = { DOCS_RS = "1", DEP_LV_CONFIG_PATH = "", RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc --no-deps -p lvgl_rust_sys --no-default-features"

[tasks.check]
description = "Checks to run before pushing"
# Sequential: concurrent builds in the same target directory race under mbx.
run = [{ task = "fmt" }, { task = "clippy" }, { task = "test-fast" }]
