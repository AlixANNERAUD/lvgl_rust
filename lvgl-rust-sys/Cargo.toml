[package]
name = "lvgl_rust_sys"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
links = "lvgl_rust_sys"
build = "build/main.rs"
description = "Low-level no_std Rust FFI bindings to LVGL 9, the embedded graphics library"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["lvgl", "gui", "embedded", "no-std", "ffi"]
categories = ["external-ffi-bindings", "embedded", "gui", "no-std"]

[features]
default = ["build-lvgl", "use-string-functions"]
build-lvgl = []
use-vendored-config = []
use-string-functions = []
shadcn-theme = []

color_depth_1 = []
color_depth_8 = []
color_depth_16 = []
color_depth_24 = []
color_depth_32 = []

[dependencies]


[build-dependencies]
bindgen = "0.72.1"
cc = "1.1.18"
