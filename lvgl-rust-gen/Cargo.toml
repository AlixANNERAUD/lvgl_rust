[package]
name = "lvgl-rust-gen"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Build-time generator of the safe LVGL bindings used by lvgl-rust"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["lvgl", "codegen", "bindings"]
categories = ["development-tools::build-utils"]
# Only the generator and its tables: `lvgl-rust`'s build script needs both.
include = ["/src/**", "/tables/**", "/README.md"]

[features]
# The `lvgl-rust-gen audit` maintainer tool (needs clang).
cli = []

[[bin]]
name = "lvgl-rust-gen"
required-features = ["cli"]

[dependencies]
prettyplease = "0.2.22"
proc-macro2 = "1.0.86"
quote = "1.0.37"
serde = { version = "1", features = ["derive"] }
syn = { version = "2.0.77", features = ["full"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
