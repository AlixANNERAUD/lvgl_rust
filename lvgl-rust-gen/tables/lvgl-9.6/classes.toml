# Widget classes (from `.base_class` in the LVGL sources) and crate rules.

# Wrapped by hand in the core (structural operations, views of the tree).
manual = [
    "lv_obj_create",
    "lv_obj_delete",
    "lv_obj_clean",
    "lv_obj_set_parent",
    "lv_obj_get_parent",
    "lv_obj_get_child",
    "lv_obj_has_class",
    "lv_obj_get_class",
    "lv_screen_active",
    "lv_screen_load",
    "lv_screen_load_anim",
    "lv_init",
    "lv_style_init",
    # Reorders children: checked like a move (structural.rs).
    "lv_obj_move_to_index",
    # Copies one entry per button: length-checked (button_map.rs).
    "lv_buttonmatrix_set_ctrl_map",
    # The open list's label shows the options as static text: re-pointed
    # after every change (manual.rs).
    "lv_dropdown_set_options",
    "lv_dropdown_set_options_static",
    "lv_dropdown_clear_options",
    # A textarea edits its label's text in place (manual.rs).
    "lv_label_set_text_static",
    # The needle divides by max - min (lv_scale.c:329, 384) (manual.rs).
    "lv_scale_set_range",
    "lv_scale_set_min_value",
    "lv_scale_set_max_value",
    # Chart series: a token checked against the chart's list (chart.rs).
    "lv_chart_add_series",
    "lv_chart_remove_series",
    "lv_chart_hide_series",
    "lv_chart_set_series_color",
    "lv_chart_get_series_color",
    "lv_chart_set_x_start_point",
    "lv_chart_get_x_start_point",
    "lv_chart_get_point_pos_by_id",
    "lv_chart_set_all_values",
    "lv_chart_set_next_value",
    "lv_chart_set_next_value2",
    "lv_chart_set_series_values",
    "lv_chart_set_series_values2",
    "lv_chart_set_series_value_by_id",
    "lv_chart_set_series_value_by_id2",
    "lv_chart_get_series_y_array",
    "lv_chart_get_series_x_array",
    # The point arrays are `sizeof(int32_t) * cnt` bytes, which wraps on
    # 32-bit targets before `cnt` points are written (lv_chart.c:1910-1942).
    "lv_chart_set_point_count",
    # Row and column are checked only under LV_USE_CHECK_ARG, and the
    # counts multiply in 32 bits before allocating (lv_table.c:231, 246,
    # 271): bounds and sizes checked in Rust (table.rs).
    "lv_table_set_row_count",
    "lv_table_set_column_count",
    "lv_table_set_column_width",
    "lv_table_set_cell_value",
    "lv_table_set_cell_ctrl",
    "lv_table_clear_cell_ctrl",
    "lv_table_get_cell_value",
    "lv_table_get_cell_user_data",
    "lv_table_get_selected_cell",
    # tile_act is never cleared when its tile goes (lv_tileview.c:99, 192)
    # and the tile is cast without a class check (97): the active tile is
    # checked against the current children, and set_tile takes only one
    # of them (tileview.rs).
    "lv_tileview_get_tile_active",
    # The SCROLL_END handler divides by the content width and height
    # (lv_tileview.c:181-182), which layout or styles can bring to 0: the
    # wrapper installs a guard that stops the event first (tileview.rs).
    "lv_tileview_create",
    "lv_tileview_set_tile",
    # The arrow header indexes month names with the shown month, unchecked
    # (lv_calendar_header_arrow.c:148, 164): months are checked (calendar.rs).
    "lv_calendar_set_month_shown",
    "lv_calendar_set_shown_month",
    # Shims the core uses; they assume the object's class.
    "lvgl_sys_menu_part",
    "lvgl_sys_obj_is_deleting",
    "lvgl_sys_obj_events_traversing",
    "lvgl_sys_keyboard_forget_textarea",
    # Hit test parameter accessors; valid only for a HIT_TEST event's
    # parameter (query.rs).
    "lvgl_sys_hit_test_point",
    "lvgl_sys_hit_test_result",
    "lvgl_sys_hit_test_set_result",
    "lv_deinit",
    "lv_timer_handler",
]

# Base class of each widget whose base is not `obj`.
[hierarchy]
animimg = "image"
barcode = "canvas"
canvas = "image"
ffmpeg_player = "image"
gif = "image"
gstreamer = "image"
keyboard = "buttonmatrix"
list_button = "button"
list_text = "label"
lottie = "canvas"
qrcode = "canvas"
rlottie = "image"
slider = "bar"
spinbox = "textarea"
spinner = "arc"

# Rust names of classes made of several words.
[names]
buttonmatrix = "ButtonMatrix"
imagebutton = "ImageButton"
list_button = "ListButton"
list_text = "ListText"
msgbox = "MsgBox"
spangroup = "SpanGroup"
tabview = "TabView"
textarea = "TextArea"
tileview = "TileView"
ffmpeg_player = "FfmpegPlayer"

[crate_owned]
# The crate defines LVGL's OBJ_ID hooks.
skip = [
    "lv_obj_assign_id",
    "lv_obj_free_id",
    "lv_obj_set_id",
    "lv_obj_id_compare",
    "lv_obj_stringify_id",
]
# Would remove or replace what the crate installs, or write LVGL's
# non-atomic clock.
raw = [
    "lv_obj_remove_event*",
    "lv_timer_set_user_data",
    "lv_timer_set_cb",
    "lv_timer_set_auto_delete",
    "lv_display_set_driver_data",
    "lv_display_set_flush_cb",
    "lv_display_set_flush_wait_cb",
    "lv_indev_set_driver_data",
    "lv_indev_set_read_cb",
    "lv_anim_set_*_cb",
    "lv_anim_set_user_data",
    "*_set_external_data",
    "lv_tick_set_cb",
    "lv_tick_inc",
]

# Widgets whose constructor creates no child and that keep no pointer to
# their children: children are the application's.
[composite.button]
parts = []
max_depth = 1

[composite.label]
parts = []
max_depth = 1

[composite.image]
parts = []
max_depth = 1

[composite.switch]
parts = []
max_depth = 1

[composite.bar]
parts = []
max_depth = 1

[composite.arc]
parts = []
max_depth = 1

[composite.led]
parts = []
max_depth = 1

[composite.line]
parts = []
max_depth = 1

[composite.checkbox]
parts = []
max_depth = 1

[composite.canvas]
parts = []
max_depth = 1

[composite.imagebutton]
parts = []
max_depth = 1

[composite.scale]
parts = []
max_depth = 1

# Series and cursors live in lists of the chart, not in children.
[composite.chart]
parts = []
max_depth = 1

[composite.buttonmatrix]
parts = []
max_depth = 1

[composite.table]
parts = []
max_depth = 1

[composite.spangroup]
parts = []
max_depth = 1

[composite.dropdown]
# The list lives on the screen and LVGL resets its pointer when the list is
# deleted (lv_dropdown.c:790, 830): not a part.
parts = []
max_depth = 1

[composite.list]
# Items added by lv_list_add_* are the application's: the list keeps no
# pointer to them.
parts = []
max_depth = 1

[composite.win]
# Found by child index (lv_win_get_header/content): no child goes before
# them.
parts = ["lv_win_get_header", "lv_win_get_content"]
max_depth = 1
closed = true

[composite.msgbox]
parts = ["lv_msgbox_get_header", "lv_msgbox_get_title", "lv_msgbox_get_footer", "lv_msgbox_get_content"]
max_depth = 2
# The close button's callback deletes parent(parent(button)) as the message
# box (lv_msgbox.c:313-321, 295): the header's children stay in place.
indexed = { lv_msgbox_get_header = 1 }

# spinbox inherits it.
[composite.textarea]
parts = ["lv_textarea_get_label"]
max_depth = 1

# The label is child 0 (lv_roller.c: lv_obj_get_child(obj, 0) throughout):
# a child put before it would be cast to a label.
[composite.roller]
parts = ["child:0"]
max_depth = 1
closed = true

# No entry for menu: LVGL keeps pointers to its pages and to the selected
# sidebar entry, at any depth inside them (lv_menu.c:237, 245, 832, 884),
# and every lv_menu_* function is deprecated in 9.6 (menus come from raw
# code only): everything inside a menu stays refused.

# LVGL finds the bar and content by child index, the pages by child count
# and the buttons and their labels by typed index (lv_tabview.c:114, 126-130,
# 142, 186, 292, 306, 312).
[composite.tabview]
parts = ["lv_tabview_get_tab_bar", "lv_tabview_get_content"]
max_depth = 3
indexed = { lv_tabview_get_tab_bar = 2, lv_tabview_get_content = 1 }

# No child, no object pointer (lv_arclabel.c:380-401).
[composite.arclabel]
parts = []
max_depth = 1

# A dropdown's list: open and draw take child 0 as its label, unchecked
# (lv_dropdown.c:818, 1484-1491).
[composite.dropdownlist]
parts = ["child:0"]
max_depth = 1
closed = true

# The calendar keeps its button matrix (calendar->btnm, never reset:
# lv_calendar.c:273-277, 371) and sends VALUE_CHANGED to its other
# children, its headers (244-251). Other children are the application's.
[composite.calendar]
parts = ["lv_calendar_get_btnmatrix"]
max_depth = 1

# The arrow header's handlers take child 0 as the previous-month button,
# child 1 as the label they write (lv_calendar_header_arrow.c:126, 147-148,
# 163-164) and the header's parent, and the button's grandparent, as the
# calendar (113-119, 156-159), unchecked.
[composite.calendar_header_arrow]
parts = ["child:0", "child:1", "child:2"]
max_depth = 1
closed = true
pinned = true

# The dropdown header (created from raw code only, see audit.toml) reads
# child 0 and 1 as its dropdowns and its parent as the calendar, and the
# dropdowns' handlers keep the calendar as user data
# (lv_calendar_header_dropdown.c:112-127, 184-195).
[composite.calendar_header_dropdown]
parts = ["child:0", "child:1"]
max_depth = 1
closed = true
pinned = true

# The tile view casts every child to a tile and reads its `dir`, found by
# position (lv_tileview.c:97-101, 118-125, 186-193): children come only
# from lv_tileview_add_tile. Tiles keep no pointer to their children.
[composite.tileview]
parts = []
max_depth = 1
closed = true

[composite.tileview_tile]
parts = []
max_depth = 1

# Message box buttons: their only child is a label or an icon, which
# nothing refers back to (lv_msgbox.c:182-186, 248-252).
[composite.msgbox_header_button]
parts = []
max_depth = 1

[composite.msgbox_footer_button]
parts = []
max_depth = 1
