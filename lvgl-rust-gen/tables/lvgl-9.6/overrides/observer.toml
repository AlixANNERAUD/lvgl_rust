# Subjects of bindings: LVGL checks their type only with LV_CHECK_ARG,
# which configurations compile out, so the subject is a typed crate
# subject (initialised on first use). LVGL keeps it and writes to it.

[fn.lv_obj_bind_flag_if_eq]
params.subject = { kind = "retained", rust = "IntSubject" }
why = "core/lv_observer.c: the subject must be an int subject (LV_CHECK_ARG only); LVGL adds an observer node to it (lv_subject_add_observer_obj) and keeps the pointer for the object's lifetime."

