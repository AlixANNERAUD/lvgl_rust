# Style properties that point to data: LVGL keeps the pointer in the style
# and reads it while drawing, so the data is a `'static` crate type.

[fn.lv_style_set_bg_image_src]
params.value = { kind = "retained", rust = "ImageSrc" }
why = "lv_style_set_bg_image_src stores the pointer in the style (lv_style_gen.c, .ptr = value); LVGL reads it while drawing, so it must stay valid."

