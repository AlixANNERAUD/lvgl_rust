# Parameter kinds, each checked against the LVGL sources (file:line in `why`).
[fn.lv_buttonmatrix_clear_button_ctrl]
params.btn_id = { kind = "checked" }
why = "lv_buttonmatrix.c:204 has a plain if(btn_id >= btnm->btn_cnt) return; before ctrl_bits[btn_id] at line 206. invalidate_button_area checks again at lv_buttonmatrix.c:984 and :990."

[fn.lv_buttonmatrix_get_button_text]
returns = "borrowed_internal"
params.btn_id = { kind = "checked" }
why = "lv_buttonmatrix.c:283 rejects LV_BUTTONMATRIX_BUTTON_NONE and line 286 has a plain if(btn_id >= btnm->btn_cnt) return NULL; before the map walk at lines 293-297, which therefore stays inside the btn_cnt buttons of the map. Returns: lv_buttonmatrix.c:279-302 returns an entry of map_p, the map the widget was given, or NULL."

[fn.lv_buttonmatrix_has_button_ctrl]
params.btn_id = { kind = "checked" }
why = "lv_buttonmatrix.c:309 has a plain if(btn_id >= btnm->btn_cnt) return false; before ctrl_bits[btn_id] at line 311."

[fn.lv_buttonmatrix_set_button_ctrl]
params.btn_id = { kind = "checked" }
why = "lv_buttonmatrix.c:184 has a plain if(btn_id >= btnm->btn_cnt) return; before ctrl_bits[btn_id] at line 190. invalidate_button_area also checks bounds (lv_buttonmatrix.c:984, 990)."

[fn.lv_buttonmatrix_set_button_width]
params.btn_id = { kind = "checked" }
why = "lv_buttonmatrix.c:241 has a plain if(btn_id >= btnm->btn_cnt) return; before the ctrl_bits[btn_id] writes at lines 242-243."

[fn.lv_buttonmatrix_set_selected_button]
params.btn_id = { kind = "checked" }
why = "lv_buttonmatrix.c:171 returns unless btn_id < btn_cnt or btn_id is BUTTON_NONE. invalidate_button_area returns for NONE or out-of-range values (lv_buttonmatrix.c:984, 990), and btn_id_sel elsewhere is treated as a NONE-capable id."
