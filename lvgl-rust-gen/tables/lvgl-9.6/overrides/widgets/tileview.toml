# Parameter kinds, each checked against the LVGL sources (file:line in `why`).
[fn.lv_tileview_add_tile]
params.col_id = { kind = "checked" }
params.row_id = { kind = "checked" }
why = "widgets/tileview/lv_tileview.c:78, 83: col_id and row_id are used only as a position, `lv_obj_set_pos(obj, lv_pct(col_id * 100), lv_pct(row_id * 100))`, and in `== 0` comparisons. They never index memory (u8, so id*100 <= 25500, no overflow)."

[fn.lv_tileview_set_tile_by_index]
params.col_id = { kind = "checked" }
params.row_id = { kind = "checked" }
why = "widgets/tileview/lv_tileview.c:114-126: col_id and row_id only compute target coordinates that are compared with existing children's positions, in a loop bounded by lv_obj_get_child_count. If nothing matches it only logs a warning (:128). The arithmetic is unsigned, so there is no UB. The matching child is cast to a tile (lv_tileview.c:97): the closed tile view of classes.toml keeps tiles its only children."
