# Parameter kinds, each checked against the LVGL sources (file:line in `why`).
[fn.lv_spangroup_get_child]
params.id = { kind = "checked" }
why = "widgets/span/lv_span.c:453-466 walks the linked list until cur_node is NULL, comparing indexes, and returns NULL when id is out of range. There is no array indexing."

[fn.lv_spangroup_get_span_by_point]
