# Functions that store a pointer to another object. `param` names it and
# `clear` how to drop it when that object is deleted; `raw = true` keeps
# the function in `sys`.

[fn.lv_keyboard_set_textarea]
param = "ta"
clear = "lv_keyboard_set_textarea(holder, NULL)"

# Reparents the cursor and can never be cleared.
[fn.lv_indev_set_cursor]
raw = true

# Write into the needle as a line without checking its class, and register
# a handler on it that keeps the scale (lv_scale.c:284-345).
[fn.lv_scale_set_line_needle_value]
raw = true

[fn.lv_scale_set_image_needle_value]
raw = true

# Reorders two objects, possibly in different parents: not checked like a
# move yet.
[fn.lv_obj_swap]
raw = true
