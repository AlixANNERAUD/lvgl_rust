# Access of every function lvgl-rust wraps: "pure" (no LVGL state, no
# token), "isr" (no token, interrupt-safe), "shared" (cannot free objects:
# `&Lvgl` or a view), "exclusive" (may free objects: `&mut Lvgl` or an
# `ObjMut`) or "raw" (stays in `sys`). A function with no entry is not
# wrapped.
#
# This is a hand-reviewed seed for the base object and five widgets. The
# audit tool will produce and check the full table.

# Base object: geometry. Size and position changes send SIZE_CHANGED and
# style/layout events; no LVGL class handler deletes objects in response.
[fn.lv_obj_set_pos]
access = "shared"
[fn.lv_obj_set_x]
access = "shared"
[fn.lv_obj_set_y]
access = "shared"
[fn.lv_obj_set_size]
access = "shared"
[fn.lv_obj_set_width]
access = "shared"
[fn.lv_obj_set_height]
access = "shared"
[fn.lv_obj_set_align]
access = "shared"
[fn.lv_obj_align]
access = "shared"
[fn.lv_obj_align_to]
access = "shared"
[fn.lv_obj_center]
access = "shared"
[fn.lv_obj_update_layout]
access = "shared"
[fn.lv_obj_get_x]
access = "shared"
[fn.lv_obj_get_y]
access = "shared"
[fn.lv_obj_get_width]
access = "shared"
[fn.lv_obj_get_height]
access = "shared"
[fn.lv_obj_get_content_width]
access = "shared"
[fn.lv_obj_get_content_height]
access = "shared"

