# Schedule deletions that run later without the structural checks.
[fn.lv_obj_delete_async]
access = "raw"
why = "deletes later from lv_timer_handler without the structural checks (lv_obj_tree.c:142-147)"
[fn.lv_obj_delete_delayed]
access = "raw"
why = "deletes later from the animation timer without the structural checks"
