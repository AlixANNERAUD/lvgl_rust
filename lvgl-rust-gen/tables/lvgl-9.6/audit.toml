# How `lvgl-rust-gen audit` reads LVGL 9.6. It writes access.toml from the
# call graph and this file; rerun `mise run audit` after any change.

# Operations that can leave a pointer held by a running callback dangling:
# deleting objects, deleting displays, shrinking children arrays, freeing
# group list nodes. A function that reaches one of them through direct
# calls, indirect calls or event sends is exclusive. (Reordering children
# keeps every pointer valid; user-requested reorders are hand-written for
# the structural checks.)
sinks = [
    "core/lv_obj_tree::obj_delete_core",
    "lv_display_delete",
    "lv_obj_remove_child",
    "lv_group_remove_obj",
    "lv_group_remove_all_objs",
    "lv_group_delete",
]

# The sinks that delete objects: an exclusive call that can reach one may
# delete its own receiver, so its `ObjMut` method takes `self`.
deleting_sinks = ["core/lv_obj_tree::obj_delete_core", "lv_display_delete"]

# Run event handlers through `dsc->cb` (`lv_event_send`), or are the
# senders' own steps (only the senders call them): handlers are connected at
# the send sites instead, by event code.
event_dispatch = [
    "lv_event_send",
    "core/lv_obj_event::event_send_core",
    "lv_event_push_and_send",
]

# Deprecated widgets lvgl-rust does not wrap: their event handlers exist
# only on objects created through `sys`, which takes the obligation, and are
# left out of event sends.
unwrapped_widgets = ["menu"]


# ---------------------------------------------------------------------------
# Event codes (events.toml).

# How safe code sends object events (`Obj::send_event`): its body (class
# event callbacks, bubbling) and every registered handler run for the code.
object_sender = "lv_obj_send_event"

# Calls that return or dereference the event parameter without a NULL
# check (lv_obj_event.c:202-334, lv_display.c:1099, lv_indev_gesture.c):
# code that calls one for a code reads that code's parameter, so safe code
# (which sends with NULL) cannot send it.
param_getters = [
    "lv_event_get_param",
    "lv_event_get_indev",
    "lv_event_get_layer",
    "lv_event_get_old_size",
    "lv_event_get_scroll_anim",
    "lv_event_set_ext_draw_size",
    "lv_event_get_self_size_info",
    "lv_event_get_hit_test_info",
    "lv_event_get_cover_area",
    "lv_event_set_cover_res",
    "lv_event_get_draw_task",
    "lv_event_get_invalidated_area",
]
# Getters that return 0 for a NULL parameter (`k ? *k : 0`,
# lv_obj_event.c:250-268, 336-344).
param_checked_getters = [
    "lv_event_get_key",
    "lv_event_get_rotary_diff",
    "lv_event_get_prev_state",
]

# Query and draw codes: sent in the middle of hit testing, layout or
# rendering to fill their parameter. Their handlers are restricted (no
# shared access): a hold across them restricts them further instead of
# making the freeing function exclusive.
blockable_codes = [
    "LV_EVENT_HIT_TEST",
    "LV_EVENT_COVER_CHECK",
    "LV_EVENT_REFR_EXT_DRAW_SIZE",
    "LV_EVENT_DRAW_MAIN_BEGIN",
    "LV_EVENT_DRAW_MAIN",
    "LV_EVENT_DRAW_MAIN_END",
    "LV_EVENT_DRAW_POST_BEGIN",
    "LV_EVENT_DRAW_POST",
    "LV_EVENT_DRAW_POST_END",
    "LV_EVENT_DRAW_TASK_ADDED",
    "LV_EVENT_GET_SELF_SIZE",
]


# ---------------------------------------------------------------------------
# Held regions (see held.rs): memory a frame keeps a pointer to across an
# event send, and the shared functions that can free it.

# The functions that release memory, with the index of the freed pointer.
free_primitives = { lv_free = 0, lv_realloc = 0 }
# The functions that return fresh memory (lv_mem.c, lv_string_builtin.c).
alloc_primitives = ["lv_malloc", "lv_malloc_zeroed", "lv_realloc", "lv_strdup", "lv_strndup"]

# Functions that free memory they allocated only where it was not
# published (the analysis does not follow paths), with the reason.
[unpublished]
lv_obj_class_create_obj = "frees the new object only when allocating the parent's attributes or lv_obj_add_child failed (lv_obj_class.c:94-100); lv_obj_add_child stores the child only after its realloc succeeded (lv_obj.c:1213-1218)"

# Globals emitted with a literal struct type (bitfields): their struct.
[literal_globals]
"lv_*_class" = "_lv_obj_class_t"

# Event senders: index of the event code argument.
[send]
lv_obj_send_event = 1
lv_display_send_event = 1
lv_indev_send_event = 1

# Event handler registrations: [callback index, event code index].
[register_event]
lv_obj_add_event_cb = [1, 2]
lv_display_add_event_cb = [1, 2]
lv_indev_add_event_cb = [1, 2]
lv_event_add = [1, 2]

# Hand decisions, with the reason. They override the graph.
# LVGL's own lifecycle and global state: never from safe code.
[exceptions.lv_mem_init]
access = "raw"
why = "initialises LVGL's heap pool (lv_mem.c): LVGL's lifecycle belongs to lvgl_rust::init"

[exceptions.lv_mem_deinit]
access = "raw"
why = "frees LVGL's heap pool under every live object (lv_mem.c)"

[exceptions.lv_draw_init]
access = "raw"
why = "re-initialises the draw units while objects and draw tasks use them (lv_draw.c)"

[exceptions.lv_draw_deinit]
access = "raw"
why = "frees the draw units while objects and draw tasks use them (lv_draw.c)"

[exceptions.lv_bin_decoder_init]
access = "raw"
why = "registers another binary decoder (lv_bin_decoder.c): part of lv_init"

[exceptions.lv_flex_init]
access = "raw"
why = "registers the flex layout again (lv_flex.c): part of lv_init"

[exceptions.lv_grid_init]
access = "raw"
why = "registers the grid layout again (lv_grid.c): part of lv_init"

[exceptions.lv_span_stack_init]
access = "raw"
why = "replaces the global snippet stack (lv_span.c) without freeing it"

[exceptions.lv_span_stack_deinit]
access = "raw"
why = "frees the global snippet stack (lv_span.c) without clearing it: span drawing uses it afterwards"

[exceptions.lv_theme_default_deinit]
access = "raw"
why = "frees theme_def (lv_theme_default.c) while objects and their theme keep pointers to it"

[exceptions.lv_theme_simple_deinit]
access = "raw"
why = "frees the simple theme (lv_theme_simple.c) while objects keep pointers to it"

[exceptions.lv_theme_mono_deinit]
access = "raw"
why = "frees the mono theme (lv_theme_mono.c) while objects keep pointers to it"

[exceptions.lv_fs_remove_drive]
access = "raw"
why = "removes a driver that open files and image sources may still use (lv_fs.c)"

[exceptions.lv_obj_class_init_obj]
access = "raw"
why = "runs a class constructor again on an initialised object (lv_obj_class.c): only for objects made with lv_obj_class_create_obj"

# The dropdown header's handlers parse the year dropdown's options as
# "YYYY\n" entries without bounds checks (lv_calendar_header_dropdown.c:161-169,
# where LV_ASSERT is off in most configurations, and 189-193), and those
# options can be changed through any dropdown setter of a view of the year
# dropdown: the header stays out of safe code.
[exceptions.lv_calendar_add_header_dropdown]
access = "raw"
why = "its handlers read the year dropdown's options as fixed YYYY entries, unchecked (lv_calendar_header_dropdown.c:161-169, 189-193), and dropdown setters reached through views can change them"

[exceptions.lv_calendar_header_dropdown_set_year_list]
access = "raw"
why = "any text becomes the year options, which the dropdown header's handlers parse as fixed YYYY entries, unchecked (lv_calendar_header_dropdown.c:161-169, 189-193)"

[exceptions.lv_color_make]
access = "pure"
why = "computes a value"

[exceptions.lv_color_hex]
access = "pure"
why = "computes a value"

[exceptions.lv_color_mix]
access = "pure"
why = "computes a value"

[exceptions.lv_pct]
access = "pure"
why = "computes a value"

# Widget code sends events to objects of its own widget, of widgets it
# creates, or of widgets that create it (it is their part); a send there
# reaches only handlers registered by core code or by those widgets. These
# widgets also send to objects of the listed widgets.
[peers]
keyboard = ["textarea", "spinbox"]

# Animation callbacks run for the instance their caller filled: they are
# attributed to whoever installs them, as calls (`lv_anim_start` applies
# `exec_cb`, `custom_exec_cb`, `get_value_cb` and `path_cb` at once) or as
# scheduled work (`start_cb`, `completed_cb`, run by the anim timer).
# `deleted_cb` (field 5) stays an ordinary slot: deleting any animation, as
# `lv_anim_start` does for a previous one on the same variable, runs it.
# Field indices of `_lv_anim_t` with `LV_USE_EXT_DATA 0`.
[caller_slots]
"_lv_anim_t.1" = "immediate"
"_lv_anim_t.2" = "immediate"
"_lv_anim_t.6" = "immediate"
"_lv_anim_t.8" = "immediate"
"_lv_anim_t.3" = "later"
"_lv_anim_t.4" = "later"

# Animations told apart (identity.rs). `lv_anim_delete(var, exec_cb)`
# removes the animations whose `var` and `exec_cb` match (lv_anim.c:190),
# running their `deleted_cb` and freeing them (remove_anim, lv_anim.c:
# 875-887); `lv_anim_start` first removes the running animations with the
# same `var` and `exec_cb`, only when `early_apply` is on and `exec_cb` is
# set (lv_anim.c:124-126, 836-859), then runs the callbacks only when
# `early_apply` is on (lv_anim.c:141-158). A removal with a constant
# `exec_cb`, a `var` of a known struct type, or started from a local whose
# setters are all visible, reaches only the `deleted_cb`s of the
# animations it can match, and frees only them. Field indices of
# `_lv_anim_t` with `LV_USE_EXT_DATA 0`.
[animation]
structure = "_lv_anim_t"
start = "lv_anim_start"
init = "lv_anim_init"
delete = "lv_anim_delete"
delete_var_arg = 0
delete_exec_arg = 1
delete_carry = ["lv_anim_delete", "misc/lv_anim::remove_anim"]
start_carry = ["lv_anim_start", "misc/lv_anim::remove_concurrent_anims"]
# Runs a->deleted_cb(a) only for a running animation whose exec_cb (not
# NULL) and var equal those of a_current, and reads a_current again on the
# next iteration (lv_anim.c:841-866).
concurrent_removal = "misc/lv_anim::remove_concurrent_anims"
# Animations are freed only at lv_anim.c:736, 859 and 886, each right after
# the same frame unlinked them from anim_ll (lv_anim.c:723, 851, 878), and
# every removal finds what it frees by walking anim_ll (lv_anim.c:186-199,
# 208, 841-866; lv_ll.c:165-186); insertions allocate new nodes
# (lv_ll_ins_head, lv_anim.c:129), so an unlinked node is never linked
# again. A frame that keeps an animation it unlinked across a callback is
# the only one that can free it. Only lv_anim.c names anim_ll.
unlink = { function = "lv_ll_remove", list_arg = 0, node_arg = 1, list_field = "lv_anim_state_t.4" }
var_slot = "_lv_anim_t.0"
exec_slot = "_lv_anim_t.1"
deleted_slot = "_lv_anim_t.5"
early_apply_setter = "lv_anim_set_early_apply"
# lv_obj_scroll_by passes its animation with SCROLL_BEGIN
# (lv_obj_scroll.c:365, 380); no LVGL code reads it back
# (lv_event_get_scroll_anim has no caller), lvgl-rust handlers do not see
# it, and a handler installed through `sys` that writes it is that code's
# obligation.
event_parameter = { lv_obj_send_event = 2 }

# lv_<widget>_create calls lv_obj_class_init_obj(obj) right after
# obj = lv_obj_class_create_obj(&class, parent), which sets obj->class_p
# (lv_obj_class.c:53); lv_obj_construct runs the constructor_cb of
# obj->class_p after recursing into its base_class with obj->class_p set to
# each base in turn (lv_obj_class.c:219-232). Nothing in between writes
# class_p: lv_theme_apply, which runs first (lv_obj_class.c:111), only
# removes and adds styles (lv_theme.c:66-76), and the audit requires no
# other call and no store through a pointer on any path between the
# creation and the init call, every block in between entered only from
# earlier ones (no loop runs init again), and a local whose address never
# escapes. The class chain is read from the initializers of the class
# globals.
[construction]
create = "lv_obj_class_create_obj"
init = "lv_obj_class_init_obj"
construct = "core/lv_obj_class::lv_obj_construct"
class_structure = "_lv_obj_class_t"
base_field = 0
constructor_field = 1
why = "an object built right after lv_obj_class_create_obj has that class"

# Hand decisions on event codes.
[event_policy.LV_EVENT_CREATE]
handler = "none"
sendable = "no"
why = "sent by lv_obj_class_init_obj while the object is being built (lv_obj_class.c), before any handler can be registered; a fake CREATE reruns creation logic"

[event_policy.LV_EVENT_DELETE]
sendable = "no"
why = "DELETE handlers free per-object state on the assumption that the object goes away (lv_event_free_user_data_cb, lv_obj.c:1365; unsubscribe_on_delete_cb, lv_observer.c:538): a fake DELETE frees it while the object keeps using it"

[event_policy.LV_EVENT_INVALIDATE_AREA]
handler = "none"
why = "display event (lv_display.c): sent to displays, not objects"

[event_policy.LV_EVENT_RESOLUTION_CHANGED]
handler = "none"
why = "display event (lv_display.c): sent to displays, not objects"

[event_policy.LV_EVENT_COLOR_FORMAT_CHANGED]
handler = "none"
why = "display event (lv_display.c): sent to displays, not objects"

[event_policy.LV_EVENT_REFR_REQUEST]
handler = "none"
why = "display event (lv_display.c, lv_refr.c): sent to displays, not objects"

[event_policy.LV_EVENT_REFR_START]
handler = "none"
why = "display event (lv_refr.c): sent to displays, not objects"

[event_policy.LV_EVENT_REFR_READY]
handler = "none"
why = "display event (lv_refr.c): sent to displays, not objects"

[event_policy.LV_EVENT_RENDER_START]
handler = "none"
why = "display event (lv_refr.c): sent to displays, not objects"

[event_policy.LV_EVENT_RENDER_READY]
handler = "none"
why = "display event (lv_refr.c): sent to displays, not objects"

[event_policy.LV_EVENT_FLUSH_START]
handler = "none"
why = "display event (lv_refr.c): sent to displays around flush_cb, with the frame buffer in use"

[event_policy.LV_EVENT_FLUSH_FINISH]
handler = "none"
why = "display event (lv_refr.c): sent to displays around flush_cb, with the frame buffer in use"

[event_policy.LV_EVENT_FLUSH_WAIT_START]
handler = "none"
why = "display event (lv_refr.c): sent to displays, not objects"

[event_policy.LV_EVENT_FLUSH_WAIT_FINISH]
handler = "none"
why = "display event (lv_refr.c): sent to displays, not objects"

[event_policy.LV_EVENT_SYNC_START]
handler = "none"
why = "display event: sent to displays, not objects"

[event_policy.LV_EVENT_SYNC_FINISH]
handler = "none"
why = "display event: sent to displays, not objects"

[event_policy.LV_EVENT_SYNC_WAIT_START]
handler = "none"
why = "display event: sent to displays, not objects"

[event_policy.LV_EVENT_SYNC_WAIT_FINISH]
handler = "none"
why = "display event: sent to displays, not objects"

[event_policy.LV_EVENT_UPDATE_LAYOUT_COMPLETED]
handler = "none"
why = "display event (lv_obj_pos.c:354): sent to displays, not objects"

[event_policy.LV_EVENT_VSYNC]
handler = "none"
why = "display event: sent to displays, not objects"

[event_policy.LV_EVENT_VSYNC_REQUEST]
handler = "none"
why = "display event: sent to displays, not objects"

# Holds made harmless by a runtime check, with the check and the reason.
# A hazard is skipped when its region (as `--verbose` prints it) is listed
# and its freer (or holding frame) is covered.
[guarded.anim_list]
regions = ["Obj(_lv_anim_t)"]
holders = ["misc/lv_anim::anim_timer"]
check = "LVGL: state.anim_list_changed, set by every animation removal (lv_anim.c, anim_mark_list_change)"
why = "anim_timer reads the animation after its callbacks only if the list did not change (lv_anim.c:640, 672, 675, 692) and restarts from the head otherwise"

[guarded.timer_list]
regions = ["Obj(_lv_timer_t)"]
holders = ["misc/lv_timer::lv_timer_exec", "lv_timer_handler"]
check = "LVGL: state.timer_deleted / timer_created, set by lv_timer_delete and lv_timer_create (lv_timer.c)"
why = "lv_timer_exec touches the timer after its callback only if no timer was deleted (lv_timer.c:369), and lv_timer_handler restarts from the head when one was created or deleted (lv_timer.c:104)"

[guarded.anim_unlinked]
regions = ["Obj(_lv_anim_t)"]
holders = [
    "misc/lv_anim::anim_completed_handler",
    "display/lv_display::scr_anim_completed",
    "misc/lv_anim::remove_anim",
    "lv_anim_delete",
]
check = "LVGL: animations are unlinked before their callbacks run (anim_completed_handler, lv_anim.c:723; remove_anim, lv_anim.c:878), and lv_anim_delete restarts from the head after a removal (lv_anim.c:198-200)"
why = "animation removals find animations by walking the list (lv_anim_delete, lv_anim_delete_all, remove_concurrent_anims in lv_anim.c), so they cannot free an animation whose callbacks are running: its owner frees it afterwards (lv_anim.c:735, 886)"

[guarded.async_info]
regions = ["Buf(_lv_timer_t.3)"]
freers = ["lv_async_call_cancel"]
check = "LVGL: lv_async_call_cancel frees the user data only of timers whose callback is lv_async_timer_cb (lv_async.c:81-88)"
why = "the timers whose user data other frames keep (input device read timers, lv_indev.c) run other callbacks"

[guarded.event_list_cleanup]
regions = ["Copy(*_lv_event_list_t.0/*)"]
holders = ["lv_event_send"]
via = ["misc/lv_event::cleanup_event_list_core"]
check = "LVGL: list->is_traversing: a nested lv_event_send returns before its cleanup (lv_event.c:143) and cleanup_event_list returns while the list is traversed (lv_event.c:495); removals only mark descriptors meanwhile"
why = "lv_event_send's copy of the list header (lv_event.c:111) is never freed under it by cleanups other than its own, which runs after the traversal"

[guarded.event_list_add_obj]
regions = ["Copy(*_lv_event_list_t.0/*)"]
holders = ["lv_event_send"]
freers = ["lv_obj_add_event_cb"]
check = "lvgl-rust: Obj::add_handler returns Busy inside callbacks while lvgl_sys_obj_events_traversing(obj) (lvgl-rust/src/event.rs; lvgl-rust-sys/shims/lvgl_sys.c)"
why = "growing an object's handler list reallocates it under lv_event_send's copy of the header, which is freed again if the object is deleted during the send (lv_event.c:111, 145): H1"

[guarded.event_list_add_display_indev]
regions = [
    "Copy(_lv_event_list_t.0/*)",
    "Copy(*_lv_display_t.*_lv_event_list_t.0/*)",
    "Copy(*_lv_indev_t.*_lv_event_list_t.0/*)",
]
holders = ["lv_event_send"]
via = ["lv_display_add_event_cb", "lv_indev_add_event_cb"]
check = "LVGL: lv_event_send uses its copy only when the event was marked deleted during the send (lv_event.c:145), which for displays and input devices only lv_display_delete and lv_indev_delete do (both exclusive)"
why = "adding a handler to a display (lv_label_mark_need_refr_text, lv_label.c:1151) or an input device reallocates its list, but no shared code can delete the display or input device being sent to, so the stale copy is never used"

# ---------------------------------------------------------------------------
# Object identity: calls that cannot happen for the objects a caller passes.

# lv_group_remove_obj returns at once for an object in no group
# (lv_group.c:185-186); lv_group_add_obj calls it first (lv_group.c:140).
# lv_obj_class_init_obj runs only on objects lv_obj_class_create_obj just
# made (its own access is raw, `exceptions`), so the object it adds to the
# default group (lv_obj_class.c:122-125) was just allocated zeroed by
# lv_obj_class_create_obj (lv_obj_class.c:51: no spec_attr, so no group),
# and only its theme, constructors and style refresh ran since: no LVGL
# code adds an object to a group except lv_obj_class_init_obj itself and
# lv_tabview_add_tab (for a button it created, after its init); the
# object has no handler yet, and handlers run during its constructors or
# style refresh get shared access, under which adding to a group is
# exclusive (group.rs). A theme apply callback installed through `sys`
# is that code's obligation.
[infeasible.fresh_object_group]
context = "lv_obj_class_init_obj -> lv_group_add_obj"
calls = ["lv_group_remove_obj"]
why = "a new object is in no group"

