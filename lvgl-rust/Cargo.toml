[package]
name = "lvgl-rust"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Safe, generated no_std Rust bindings to LVGL 9"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["lvgl", "gui", "embedded", "no-std"]
categories = ["embedded", "gui", "no-std"]
# Only one copy may define LVGL's OBJ_ID hook symbols.
links = "lvgl_rust"
build = "build.rs"
exclude = ["/size-gate"]

[features]
default = ["use-string-functions"]
use-string-functions = ["lvgl-rust-sys/use-string-functions"]
shadcn-theme = ["lvgl-rust-sys/shadcn-theme"]
# Event queues and `next_event` for async code (no executor dependency).
async = []
# Closures and owned values on LVGL's heap (`on_boxed`, `timer_boxed`).
heap = []
# LVGL's heap from a Rust allocator (`LV_USE_STDLIB_MALLOC LV_STDLIB_CUSTOM`).
allocator = []
# `Label::set_text_fmt` and `Display for Error` (links `core::fmt`).
fmt = []
# `defmt::Format` for `Error`, handles and the public enums and plain types.
defmt = ["dep:defmt"]
# Four 16-bit counters (8 bytes of .bss) read by `DebugCounters::read`.
debug-counters = []

color_depth_1 = ["lvgl-rust-sys/color_depth_1"]
color_depth_8 = ["lvgl-rust-sys/color_depth_8"]
color_depth_16 = ["lvgl-rust-sys/color_depth_16"]
color_depth_24 = ["lvgl-rust-sys/color_depth_24"]
color_depth_32 = ["lvgl-rust-sys/color_depth_32"]

[dependencies]
# The safe layer calls into the linked C library: `build-lvgl` is required.
lvgl-rust-sys = { version = "0.1.0", path = "../lvgl-rust-sys", default-features = false, features = ["build-lvgl"] }
defmt = { version = "1.0.1", optional = true }

[dev-dependencies]
# Compile-fail cases (`tests/compile_fail.rs`, `mise run test-compile-fail`).
trybuild = "1.0.99"

# Overhead of the safe API over raw calls (`mise run overhead`).
[[bench]]
name = "overhead"
harness = false

[build-dependencies]
lvgl-rust-gen = { version = "0.1.0", path = "../lvgl-rust-gen" }

# Model checking of the cross-thread request protocol (`RUSTFLAGS="--cfg loom"`).
[target.'cfg(loom)'.dependencies]
loom = "0.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }
