[package]
name = "lvgl-rust-size-gate"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
description = "Firmware measured by the lvgl-rust size gate (embedded targets only)"
license.workspace = true
publish = false
build = "build.rs"

[features]
# The diagnostic features of lvgl-rust, measured by `gate.sh ... <features>`.
defmt = ["lvgl-rust/defmt"]
debug-counters = ["lvgl-rust/debug-counters"]
# Registry chunks from a global allocator: the firmware adds a bump
# allocator, outside the crate's measured symbols.
growable-registry = ["lvgl-rust/growable-registry"]
# Owner tags, compiled for the firmware targets by `mise run cross-arm`.
owners = ["lvgl-rust/owners"]

[dependencies]
lvgl-rust = { path = ".." }

[build-dependencies]
cc = "1.1.18"
