[package]
name = "lvgl-rust-size-gate"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
description = "Firmware measured by the lvgl-rust size gate (embedded targets only)"
license.workspace = true
publish = false
build = "build.rs"

[features]
# The diagnostic features of lvgl-rust, measured by `gate.sh ... <features>`.
defmt = ["lvgl-rust/defmt"]
debug-counters = ["lvgl-rust/debug-counters"]

[dependencies]
lvgl-rust = { path = ".." }

[build-dependencies]
cc = "1.1.18"
