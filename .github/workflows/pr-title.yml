name: PR Title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      # release-plz builds the changelogs from these titles (squash merges).
      - name: Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|ci|build|conf|chore|style|revert)(\([a-z0-9_-]+\))?!?: [^ ].*$'
          if printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "Valid title: $TITLE"
          else
            echo "::error::Pull request title must follow Conventional Commits, e.g. 'feat: add a chart wrapper' or 'feat!: change the event API'. Got: $TITLE"
            exit 1
          fi
