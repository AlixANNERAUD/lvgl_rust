name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
      - run: mise run fmt

  clippy:
    name: Clippy (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            features: ""
          - name: all features
            features: --all-features
          - name: bindgen only
            features: --no-default-features
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: jdx/mise-action@v4
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-key-suffix: clippy-${{ matrix.name }}
      - run: mbx clippy --all-targets ${{ matrix.features }}

  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Full suite, including the integration tests that build fixture crates.
          - name: default
            args: ""
          # Feature variants: library and build-script unit tests only.
          - name: shadcn theme
            args: --lib --test build_config --features shadcn-theme
          - name: color depth 32
            args: --lib --test build_config --features color_depth_32
          - name: color depth 8
            args: --lib --test build_config --features color_depth_8
          - name: no string functions
            args: --lib --test build_config --no-default-features --features build-lvgl
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: jdx/mise-action@v4
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-key-suffix: test-${{ matrix.name }}
      # Integration tests run nested `cargo --offline` builds of packages that
      # have their own lockfile: download their dependencies up front.
      - name: Fetch nested package dependencies
        run: mise run fetch
      - run: mbx test ${{ matrix.args }}

  docs:
    name: Docs (docs.rs mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: jdx/mise-action@v4
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-key-suffix: docs
      # docs.rs has no DEP_LV_CONFIG_PATH: the vendored configuration must be used.
      - run: mise run doc
