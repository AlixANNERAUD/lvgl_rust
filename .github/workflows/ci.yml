name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
      - run: mise run fmt

  clippy:
    name: Clippy (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            key: default
            args: -p lvgl-rust-sys -p lvgl-rust-gen --all-targets
          - name: all features
            key: all-features
            args: -p lvgl-rust-sys --all-targets --all-features
          - name: bindgen only
            key: bindgen-only
            args: -p lvgl-rust-sys --all-targets --no-default-features
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: jdx/mise-action@v4
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-key-suffix: clippy-${{ matrix.key }}
      - run: mise exec -- cargo clippy ${{ matrix.args }}

  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Full suite, including the integration tests that build fixture crates.
          - name: default
            key: default
            args: -p lvgl-rust-sys -p lvgl-rust-gen
          # Feature variants: library and build-script unit tests only.
          - name: shadcn theme
            key: shadcn-theme
            args: -p lvgl-rust-sys --lib --test build_config --features shadcn-theme
          - name: color depth 32
            key: color-depth-32
            args: -p lvgl-rust-sys --lib --test build_config --features color_depth_32
          - name: color depth 8
            key: color-depth-8
            args: -p lvgl-rust-sys --lib --test build_config --features color_depth_8
          - name: no string functions
            key: no-string-functions
            args: -p lvgl-rust-sys --lib --test build_config --no-default-features --features build-lvgl
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: jdx/mise-action@v4
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-key-suffix: test-${{ matrix.key }}
      # Integration tests run nested `cargo --offline` builds of packages that
      # have their own lockfile: download their dependencies up front.
      - name: Fetch nested package dependencies
        run: mise run fetch
      - run: mise exec -- cargo test ${{ matrix.args }}

  audit:
    name: Access audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: jdx/mise-action@v4
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-key-suffix: audit
      - run: mise run audit-check

  safe:
    name: lvgl-rust (${{ matrix.task }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [clippy-safe, test-safe, test-views-only, test-asan, test-allocator, test-matrix, test-compile-fail, example, miri, loom]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: jdx/mise-action@v4
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-key-suffix: safe-${{ matrix.task }}
      - run: mise run ${{ matrix.task }}

  cross:
    name: Cross (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: wasm32-unknown-unknown
            task: cross-wasm32
          # wasi-sdk and wasmtime come from the task's mise tools; runs the
          # tests and the desktop example.
          - target: wasm32-wasip1
            task: cross-wasip1
          - target: riscv32imc-unknown-none-elf
            task: cross-riscv32
          - target: thumbv6m and riscv32imc firmware
            task: size-gate
          - target: thumbv7em and thumbv8m.main firmware
            task: cross-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: jdx/mise-action@v4
      # C toolchains declared in `[bootstrap.packages]` of mise.toml.
      - name: Install system packages
        run: sudo apt-get update && mise bootstrap packages apply --yes
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-key-suffix: cross-${{ matrix.task }}
      - run: mise run ${{ matrix.task }}

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: jdx/mise-action@v4
      - name: Install system packages
        run: sudo apt-get update && mise bootstrap packages apply --yes
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-key-suffix: msrv
      # The task pins its own toolchain (the root `rust-version`).
      - run: mise run msrv

  docs:
    name: Docs (docs.rs mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: jdx/mise-action@v4
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-key-suffix: docs
      # docs.rs has no DEP_LV_CONFIG_PATH: the vendored configuration must be used.
      - run: mise run doc

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: jdx/mise-action@v4
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-key-suffix: package
      # Builds each crate from its packaged sources, as crates.io would.
      - run: mise run package
